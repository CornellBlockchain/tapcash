name: device-apps

on:
  push:
    branches: [ledger-cash, main]
    paths: ["mvp/ledger-cash/app/**", ".github/workflows/device-apps.yml"]
  workflow_dispatch:

jobs:
  ledger-cash:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: flex, sdk: flex, artifact: ledger-cash-flex, target_id: "0x33300004" }
          - { target: nanos2, sdk: nanosplus, artifact: ledger-cash-nanosplus, target_id: "0x33100004" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      # The SDK sets APP_DIR from `git rev-parse --show-toplevel`: in this repo that is the repo root, not the app,
      # and in a container checkout git also refuses the "dubious ownership" dir. Pass APP_DIR and trust the dir.
      - name: Build ${{ matrix.target }}
        run: |
          git config --global --add safe.directory '*'
          make -C mvp/ledger-cash/app TARGET=${{ matrix.target }} BOLOS_SDK=/opt/${{ matrix.sdk }}-secure-sdk \
            APP_DIR="$GITHUB_WORKSPACE/mvp/ledger-cash/app" -j"$(nproc)"
      - name: Stage artifact
        run: |
          mkdir -p out
          cp mvp/ledger-cash/app/build/${{ matrix.target }}/bin/app.{elf,apdu,hex,sha256} out/
          cat > out/LOAD.txt <<EOF
          Ledger Cash, ${{ matrix.artifact }} (TARGET=${{ matrix.target }}, targetId ${{ matrix.target_id }})
          commit ${{ github.sha }}, app.sha256 $(cat out/app.sha256)

          Close Ledger Live, plug the device in by USB, unlock it, stay on the dashboard. From this folder:
            pip install ledgerblue
            python3 -m ledgerblue.runScript --scp --fileName app.apdu --elfFile app.elf
          (Windows: python instead of python3. --elfFile reads targetId ${{ matrix.target_id }} from the ELF;
           equivalent: --targetId ${{ matrix.target_id }}.)
          Confirm "Allow unsafe manager" and the install on the device. The app appears as "Ledger Cash".
          EOF
          ls -l out && cat out/LOAD.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
