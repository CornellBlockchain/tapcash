name: android

on:
  push:
    paths: ["mvp/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mvp/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/android
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gradle/actions/wrapper-validation@v6.4.0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK with licenses accepted (ANDROID_HOME set); AGP fetches missing platform/build-tools.
      - name: Unit tests + debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ledger-cash-payee-debug-apk
          path: mvp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-test-report
          path: mvp/android/app/build/reports/tests/
          if-no-files-found: ignore
